name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grocery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/grocery_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: |
          psql "$DATABASE_TEST_URL" -f migrations/deploy/init.sql
          psql "$DATABASE_TEST_URL" -f migrations/deploy/genericUpdatingFunction.sql
          psql "$DATABASE_TEST_URL" -f migrations/deploy/view.sql
        env:
          PGPASSWORD: postgres

      - name: Run tests
        run: npm test
