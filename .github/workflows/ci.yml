name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grocery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Create env file
        run: |
          cat <<EOF > .env.development
          PORT=3001
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/grocery_test
          DATABASE_TEST_URL=postgresql://postgres:postgres@localhost:5432/grocery_test
          BASE_URL=http://localhost
          EOF

      - name: Apply migrations
        run: npm run migrate:test

      - name: Run tests
        run: npm test
